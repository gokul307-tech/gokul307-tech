name: Update GitHub profile art

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install art dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py
      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Render portrait when its private source is available
        run: |
          if [ -f local-assets/portrait-source.jpg ]; then
            python scripts/make_ascii_svg.py
          else
            echo "Skipping portrait render: local-assets/portrait-source.jpg is intentionally not tracked."
          fi
      - name: Render developer dashboard and animation fallback
        run: python scripts/make_dashboard.py
      - name: Commit updated profile artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg avi-ascii.svg info-card.svg profile-dashboard.svg profile-dashboard.gif
          git diff --cached --quiet || git commit -m "chore: refresh profile art"
          git push
